<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Input Remapper - Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <h1>📡 MQTT Input Remapper</h1>
            </div>
            <div class="master-toggle">
                <span>Master Enable:</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="masterToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="/" class="active">Dashboard</a></li>
            <li><a href="/devices.html">Devices</a></li>
            <li><a href="/mappings.html">Mappings</a></li>
            <li><a href="/mqtt.html">MQTT Settings</a></li>
            <li><a href="/logs.html">Logs</a></li>
            <li><a href="/settings.html">Settings</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="activeDevices">0</div>
                <div class="stat-label">Active Devices</div>
            </div>
            <div class="stat-box">
                <div class="stat-value"><span class="status-dot" id="mqttStatus"></span></div>
                <div class="stat-label">MQTT Status</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="serviceStatus">Running</div>
                <div class="stat-label">Service Status</div>
            </div>
        </div>

        <div class="card">
            <h2>System Status</h2>
            <div class="device-info">
                <p><strong>MQTT Broker:</strong> <span id="mqttBroker">-</span></p>
                <p><strong>Master Enabled:</strong> <span id="masterStatus">-</span></p>
                <p><strong>Bluetooth:</strong> <span id="btStatus">-</span></p>
            </div>
        </div>

        <div class="card">
            <h2>Recent Activity</h2>
            <div id="recentLogs" class="log-container" style="max-height: 300px;">
                Loading...
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        // Dashboard specific code
        async function loadDashboard() {
            const status = await API.getStatus();
            document.getElementById('activeDevices').textContent = status.active_devices;
            document.getElementById('mqttStatus').className = 'status-dot ' + (status.mqtt_connected ? 'online' : 'offline');
            document.getElementById('serviceStatus').textContent = status.service_running ? 'Running' : 'Stopped';
            document.getElementById('mqttBroker').textContent = status.mqtt_broker;
            document.getElementById('masterStatus').textContent = status.master_enabled ? 'Yes' : 'No';
            document.getElementById('btStatus').textContent = status.bluetooth_available ? 'Available' : 'Not Available';
            
            // Update master toggle
            document.getElementById('masterToggle').checked = status.master_enabled;
        }

        async function loadRecentLogs() {
            const data = await API.getLogs(10);
            const container = document.getElementById('recentLogs');
            container.innerHTML = data.logs.slice(-10).reverse().join('<br>');
        }

        // Initialize
        loadDashboard();
        loadRecentLogs();
        
        // Refresh every 5 seconds
        setInterval(() => {
            loadDashboard();
            loadRecentLogs();
        }, 5000);

        // Master toggle handler
        document.getElementById('masterToggle').addEventListener('change', async (e) => {
            await API.toggleMaster(e.target.checked);
            showNotification('Master ' + (e.target.checked ? 'enabled' : 'disabled'));
        });
    </script>
</body>
</html>
